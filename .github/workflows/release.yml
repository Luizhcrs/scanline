name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Test
        working-directory: app
        run: npm run test

      - name: Rebuild native modules (node-pty)
        working-directory: app
        run: ./node_modules/.bin/electron-rebuild

      - name: Build and package (macOS DMG)
        working-directory: app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Scanline-mac
          path: app/dist-installer/*.dmg

  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Test
        working-directory: app
        run: npm run test

      - name: Rebuild native modules (node-pty)
        working-directory: app
        run: ./node_modules/.bin/electron-rebuild
        shell: bash

      - name: Build and package (Windows installer)
        working-directory: app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Scanline-win
          path: app/dist-installer/*.exe

  publish:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Scanline-mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Scanline-win
          path: artifacts/win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Scanline ${{ github.ref_name }}"
          body: |
            ## Downloads
            - **macOS** (Apple Silicon + Intel): `.dmg`
            - **Windows**: `.exe` installer
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
