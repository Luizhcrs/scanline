appId: dev.luizrs.scanline
productName: Scanline
copyright: Copyright 2025 Luiz Henrique
directories:
  output: dist-installer
  buildResources: icons
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - "!node_modules/.cache"
extraResources:
  - from: icons
    to: icons
win:
  target:
    - target: nsis
      arch: [x64]
  icon: icons/icon.ico
  extraResources:
    - from: scanline-cli.exe
      to: scanline-cli.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extraResources:
    - from: scanline-cli
      to: scanline-cli
