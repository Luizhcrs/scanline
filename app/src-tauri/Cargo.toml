[package]
name = "app"
version = "0.1.0"
description = "Windows-native terminal multiplexer + scriptable browser for AI coding agents"
authors = ["Luiz <luizhcrs@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/luizhcrs/scanline"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Release: smaller, faster binary. panic stays "unwind" so the crash.log hook
# runs (DWM/CDP/FFI paths are not validated for abort-unwinding).
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables multi-webview (child webviews) — required for native
# browser panes that bypass X-Frame-Options.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time"] }
tauri-plugin-notification = "2.3.3"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# Windows-only: direct access to the WebView2 COM API so we can drive the
# DevTools Protocol (CallDevToolsProtocolMethodAsync) for the scriptable
# browser. Versions pinned to match Tauri's transitive deps so the
# ICoreWebView2Controller type returned by PlatformWebview::controller() unifies.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

